<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./apps/">
  <title>Aaron's Apps</title>
  <link rel="icon" href="./apps/icon.svg" type="image/svg+xml">
  <style>
    body { font: 450 16px system-ui, sans-serif; background: #05050c; color: #d0d6e0; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    a { color: #44ffaa; }
  </style>
</head>
<body>
  <p>Opening <a id="go" href="./apps/">Aaron's Apps</a>…</p>
  <script>
    (function () {
      const dest = new URL('./apps/', location.href);
      dest.search = location.search;
      dest.hash = location.hash;
      const go = document.getElementById('go');
      if (go) go.href = dest.href;

      const jump = () => { location.replace(dest.href); };

      if (!('serviceWorker' in navigator)) { jump(); return; }
      navigator.serviceWorker.getRegistrations().then(regs =>
        Promise.all(regs.map(r => {
          const u = (r.active && r.active.scriptURL) ||
            (r.waiting && r.waiting.scriptURL) ||
            (r.installing && r.installing.scriptURL) || '';
          if (u && u.indexOf('/apps/service-worker') === -1) return r.unregister();
        }))
      ).finally(jump).catch(jump);
    })();
  </script>
</body>
</html>
