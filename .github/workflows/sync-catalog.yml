name: Camp mother — sync app catalog

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [hub-sync]
  push:
    paths:
      - "apps/registry.json"
      - "scripts/sync-catalog.py"
      - ".github/workflows/sync-catalog.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull hub.json + PWA icons from each app repo
        env:
          HUB_SYNC_TOKEN: ${{ secrets.HUB_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-catalog.py
        continue-on-error: true
      - name: Commit catalog + icons if they changed
        run: |
          git config user.name "camp-mother"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/catalog.json apps/icons/
          if git diff --staged --quiet; then
            echo "Catalog already current."
          else
            git commit -m "Sync app catalog and PWA icons from hub manifests."
            git push
          fi
